[project]
name = "gxpsoft-poc"
version = "0.1.0"
description = "AI-Agent-First, HITL-Second QMS Proof of Concept"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlmodel>=0.0.19",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "pydantic-ai>=0.0.30",
    "langfuse>=2.50.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gxpsoft"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

